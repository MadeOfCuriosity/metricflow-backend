version: 1.0
runtime: python311

build:
  commands:
    build:
      - pip3 install -r requirements.txt

run:
  command: bash start.sh
  network:
    port: 8000
  env:
    - name: ENVIRONMENT
      value: "production"
    - name: FRONTEND_URL
      value: "https://main.d33ftwd17k5p6o.amplifyapp.com"
    # Non-secret: comma-separated plan_code:razorpay_plan_id mapping.
    # Must match what the frontend's PLAN_DISPLAY expects.
    - name: RAZORPAY_PLAN_IDS
      value: "team:plan_Sg1ynaoLncjoaj,team_annual:plan_Sg20Hn7jHQfqE9,business:plan_Sg1zHMUK3M2PwK,business_annual:plan_Sg20opJswKsPl9"
  secrets:
    - name: DATABASE_URL
      value-from: "arn:aws:secretsmanager:us-east-2:170690344518:secret:metricflow/databaseurl-0lANQz"
    - name: SECRET_KEY
      value-from: "arn:aws:secretsmanager:us-east-2:170690344518:secret:metricflow/jwt-secret-nG3RlQ"
    - name: ENCRYPTION_KEY
      value-from: "arn:aws:secretsmanager:us-east-2:170690344518:secret:metricflow/encryption-key-1AAZv6"
    - name: RAZORPAY_KEY_ID
      value-from: "arn:aws:secretsmanager:us-east-2:170690344518:secret:metricflow/razorpay-key-id-VoF5EP"
    - name: RAZORPAY_KEY_SECRET
      value-from: "arn:aws:secretsmanager:us-east-2:170690344518:secret:metricflow/razorpay-key-secret-KAxZof"
    - name: RAZORPAY_WEBHOOK_SECRET
      value-from: "arn:aws:secretsmanager:us-east-2:170690344518:secret:metricflow/razorpay-webhook-secret-oTBSfj"
